<!doctype html>
<html lang="ne">
<head>

    <a href="#/lessons" data-tab="lessons"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5m4 2h7"/></svg><span>पाठ</span></a>
